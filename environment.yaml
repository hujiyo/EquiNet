# EquiNet conda 环境定义（conda 层）
#
# 本文件只负责创建 conda 环境和 Python 解释器；
# 所有 Python 包（含 CUDA 版 torch）由 requirements.txt 锁定并安装。
#
# 之所以拆成两个文件：torch 的 CUDA wheel 只存在于 PyTorch 官方源，
# 而 conda 的 environment.yaml 无法在 pip 段指定 index-url。
# 若把 `torch==2.14.1+cu126` 直接写在此文件的 pip 段，重建时 pip 会去
# PyPI 找，找不到就回退安装 CPU 版 torch —— 这是本项目明令禁止的。
# requirements.txt 支持 `--extra-index-url` 行，能精确锁定 CUDA 源。
#
# 完整重建步骤：
#     conda env create -f environment.yaml
#     conda activate equinet
#     pip install -r requirements.txt
#
# 验证是否装到 CUDA 版（必须 built cuda 非 None）：
#     python -c "import torch;print(torch.__version__, torch.version.cuda, torch.cuda.is_available())"
#
name: equinet
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
